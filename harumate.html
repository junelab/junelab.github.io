```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>하루메이트 앱으로 이동 중...</title>

  <script>
    const androidUrl =
      "https://play.google.com/store/apps/details?id=com.junelab.harumate";

    const iosUrl =
      "https://apps.apple.com/kr/app/%ED%95%98%EB%A3%A8%EB%A9%94%EC%9D%B4%ED%8A%B8/id6760273701";

    const ua = navigator.userAgent.toLowerCase();

    window.onload = function () {

      // Android
      if (ua.includes("android")) {
        window.location.href = androidUrl;
      }

      // iPhone / iPad
      else if (
        ua.includes("iphone") ||
        ua.includes("ipad")
      ) {
        window.location.href = iosUrl;
      }
    };
  </script>

  <style>
    body{
      font-family:sans-serif;
      text-align:center;
      padding:40px;
      background:#ffffff;
      color:#222;
    }

    h2{
      margin-top:40px;
      font-size:24px;
    }

    p{
      margin-top:16px;
      color:#666;
    }

    .btn{
      display:block;
      width:240px;
      margin:16px auto;
      padding:16px;
      border-radius:14px;
      background:#222;
      color:white;
      text-decoration:none;
      font-size:16px;
    }
  </style>
</head>

<body>

  <h2>하루메이트 앱으로 이동 중입니다</h2>

  <p>
    자동으로 이동하지 않으면 아래 버튼을 눌러주세요.
  </p>

  <a class="btn"
     href="https://play.google.com/store/apps/details?id=com.junelab.harumate">
    Google Play
  </a>

  <a class="btn"
     href="https://apps.apple.com/kr/app/%ED%95%98%EB%A3%A8%EB%A9%94%EC%9D%B4%ED%8A%B8/id6760273701">
    App Store
  </a>

</body>
</html>
```
